# Local dev stack. `docker compose up -d`, then `npm run db:migrate`.
# Stand-ins: Postgres (Neon; the app uses node-postgres for localhost URLs), MinIO (R2), Mailpit (email).
# No Redis: @upstash/ratelimit's scripts use an Upstash-only Lua flag (allow-key-locking) that real
# Redis rejects, so dev uses the in-memory limiter (leave UPSTASH_REDIS_REST_* empty).
# Values to use are in .env.example under "Local Docker".
name: dumegud

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dumegud
      POSTGRES_PASSWORD: dumegud
      POSTGRES_DB: dumegud
      # No SCRAM: pg's SCRAM handshake calls crypto.getRandomValues(), which Next 16 flags as an
      # unstable value during prerender. Safe only because every port is bound to 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumegud -d dumegud"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dumegud-uploads local/dumegud-products local/dumegud-kyc local/dumegud-public &&
      mc anonymous set download local/dumegud-public
      "

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  postgres:
  minio:
