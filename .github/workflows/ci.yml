name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so env validation passes in CI; no real services are contacted.
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://ci:ci@localhost:5432/dumegud_ci
      HASH_PEPPER: ci-pepper-ci-pepper-ci-pepper-ci-pepper-00
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret-00
      AUTH_TRUST_HOST: "true"
      FIELD_ENCRYPTION_KEY: Y2ktZmllbGQtZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=
      DOWNLOAD_SIGNING_SECRET: ci-download-signing-secret-ci-download-00
      # E2E runs a production build without Upstash.
      ALLOW_MEMORY_RATE_LIMIT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
